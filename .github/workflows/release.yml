# Builds Grove.pkg, signed and notarized when the secrets below are set and unsigned
# otherwise. Pushing a v* tag (e.g. v1.2.0) publishes it to a GitHub release, so
# https://github.com/leowilkin/grove/releases/latest/download/Grove.pkg always points at
# the newest one. Running it by hand just attaches the pkg to the run.
#
# Signing secrets (set all five, or none):
#   DEVELOPER_ID_P12           base64 of a .p12 holding both the Developer ID Application
#                              and Developer ID Installer identities
#   DEVELOPER_ID_P12_PASSWORD  the password that .p12 was exported with
#   NOTARY_KEY                 an App Store Connect team API key (the .p8 file's contents),
#                              used to notarize
#   NOTARY_KEY_ID              that key's ID
#   NOTARY_ISSUER_ID           the issuer ID shown above the team's API keys
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pkg:
    runs-on: macos-26
    env:
      SIGNED: ${{ secrets.DEVELOPER_ID_P12 != '' }}
    steps:
      - uses: actions/checkout@v7

      - run: swift --version

      - name: Import signing identities
        if: env.SIGNED == 'true'
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          rm "$RUNNER_TEMP/developer-id.p12"
          # Apple's intermediates, so the signatures chain to a root even if the runner lacks them.
          for ca in DeveloperIDG2CA DeveloperIDCA; do
            curl -fsSL "https://www.apple.com/certificateauthority/$ca.cer" -o "$RUNNER_TEMP/$ca.cer"
            security import "$RUNNER_TEMP/$ca.cer" -k "$KEYCHAIN"
          done
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          APP_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Application: .*\)"$/\1/p' | head -1)"
          INSTALLER_IDENTITY="$(security find-identity -v "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Installer: .*\)"$/\1/p' | head -1)"
          if [ -z "$APP_IDENTITY" ] || [ -z "$INSTALLER_IDENTITY" ]; then
            echo "::error::DEVELOPER_ID_P12 needs both a Developer ID Application and a Developer ID Installer identity"
            security find-identity -v "$KEYCHAIN"
            exit 1
          fi
          echo "GROVE_SIGN_IDENTITY=$APP_IDENTITY" >> "$GITHUB_ENV"
          echo "GROVE_INSTALLER_IDENTITY=$INSTALLER_IDENTITY" >> "$GITHUB_ENV"

      - name: Build installer
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            ./scripts/build-pkg.sh "${GITHUB_REF_NAME#v}"
          else
            ./scripts/build-pkg.sh
          fi

      - name: Notarize
        if: env.SIGNED == 'true'
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          printf '%s\n' "$NOTARY_KEY" > "$RUNNER_TEMP/notary-key.p8"
          AUTH=(--key "$RUNNER_TEMP/notary-key.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID")
          xcrun notarytool submit build/Grove.pkg "${AUTH[@]}" --wait --timeout 30m --output-format json > "$RUNNER_TEMP/notary.json"
          cat "$RUNNER_TEMP/notary.json"
          if [ "$(plutil -extract status raw "$RUNNER_TEMP/notary.json")" != Accepted ]; then
            xcrun notarytool log "$(plutil -extract id raw "$RUNNER_TEMP/notary.json")" "${AUTH[@]}"
            exit 1
          fi
          xcrun stapler staple build/Grove.pkg
          spctl --assess --type install --verbose=2 build/Grove.pkg

      - uses: actions/upload-artifact@v7
        with:
          name: Grove
          path: build/Grove.pkg

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$SIGNED" = true ]; then
            NOTES="Download **Grove.pkg** below and open it to install Grove into Applications."
          else
            NOTES="Download **Grove.pkg** below and open it to install Grove into Applications. This build isn't signed yet, so the first time you open it macOS says it can't verify it: see [Install](https://github.com/$GITHUB_REPOSITORY#install) for the one-time workaround."
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" build/Grove.pkg --clobber
          else
            gh release create "$GITHUB_REF_NAME" build/Grove.pkg \
              --title "Grove ${GITHUB_REF_NAME#v}" \
              --notes "$NOTES" \
              --generate-notes \
              --verify-tag
          fi
